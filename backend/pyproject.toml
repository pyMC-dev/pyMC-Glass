[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-glass-backend"
version = "1.1.0"
description = "openHop Glass backend service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.138.0",
  "uvicorn[standard]>=0.49.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.2.2",
  "sqlalchemy>=2.0.51",
  "psycopg[binary]>=3.3.4",
  "paho-mqtt>=2.1.0",
  "cryptography>=49.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "httpx>=0.28.1",
  "ruff>=0.15.19",
]

[project.scripts]
openhop-glass-api = "app.main:run"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

